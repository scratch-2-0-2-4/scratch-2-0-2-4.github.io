name: Generate sitemap

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate sitemap.xml
        uses: cicirello/generate-sitemap@v1
        with:
          base-url-path: https://scratch-2-0-2-4.github.io
          include-root: true
          xml-declaration: true

      - name: Force XML MIME type
        run: |
          echo "AddType application/xml .xml" > .htaccess

      - name: Commit and push sitemap.xml
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add sitemap.xml .htaccess
          git commit -m "Fix sitemap for Google Search Console" || echo "No changes to commit"
          git push
