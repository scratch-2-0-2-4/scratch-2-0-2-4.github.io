<script>
window.addEventListener("load", function(){
  window.cookieconsent.initialise({
    type: "opt-in",
    content: {
      message: "Ce site utilise des cookies pour mesurer son audience.",
      dismiss: "Accepter",
      deny: "Refuser",
      link: "En savoir plus",
      href: "/politique-cookies.html"
    }
  });
});
</script>

<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}

gtag("consent", "default", {
  ad_storage: "denied",
  analytics_storage: "denied"
});
</script>

<script>
function loadGA4() {
  var gtagScript = document.createElement("script");
  gtagScript.src = "https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX";
  document.head.appendChild(gtagScript);

  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag("js", new Date());
  gtag("config", "G-VMVKWDFY5D", { anonymize_ip: true });
}

window.addEventListener("cookieconsent", function(event) {
  if (event.detail.status === "allow") {
    gtag("consent", "update", {
      ad_storage: "granted",
      analytics_storage: "granted"
    });
    loadGA4();
  }
});
</script>
