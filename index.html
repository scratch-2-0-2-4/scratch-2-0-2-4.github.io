<!-- Osano CookieConsent -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cookieconsent@3/build/cookieconsent.min.css" />
<script src="https://cdn.jsdelivr.net/npm/cookieconsent@3/build/cookieconsent.min.js"></script>

<script>
window.addEventListener("load", function(){

  window.cookieconsent.initialise({
    type: "opt-in",
    revokable: false, /* désactive le petit onglet */
    palette: {
      popup: { background: "#000" },
      button: { background: "#f1d600" }
    },
    content: {
      message: "Nous utilisons des cookies pour analyser la fréquentation et améliorer votre expérience.",
      dismiss: "Refuser les 🍪",
      allow: "Accepter les 🍪",
      link: "En savoir plus +",
      href: "/politique-cookies.html"
    },

    onInitialise: function(status) {
      if (status == cookieconsent.status.allow) enableGA();
    },
    onStatusChange: function(status) {
      if (status == cookieconsent.status.allow) enableGA();
    }
  });

});
</script>

<!-- Consent Mode v2 : refus par défaut -->
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){ dataLayer.push(arguments); }

  gtag("consent", "default", {
    ad_storage: "denied",
    analytics_storage: "denied",
    ad_user_data: "denied",
    ad_personalization: "denied"
  });
</script>

<!-- Fonction qui charge GA4 après consentement -->
<script>
function enableGA() {

  gtag("consent", "update", {
    ad_storage: "granted",
    analytics_storage: "granted"
  });

  var s = document.createElement("script");
  s.async = true;
  s.src = "https://www.googletagmanager.com/gtag/js?id=G-VMVKWDFY5D"; /* Ton ID GA4 */
  document.head.appendChild(s);

  gtag("js", new Date());
  gtag("config", "G-VMVKWDFY5D"); /* Ton ID GA4 */
}
</script>
