<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Followers Scratch_2_0_2_4</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
      padding-top: 80px;
    }
    .card {
      background: #1a1a1a;
      padding: 30px;
      width: 300px;
      margin: auto;
      border-radius: 12px;
      box-shadow: 0 0 15px #0008;
    }
    .number {
      font-size: 60px;
      font-weight: bold;
      color: #4da3ff;
    }
    .label {
      font-size: 20px;
      opacity: 0.8;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="label">Followers</div>
    <div id="followers" class="number">...</div>
    <div class="label">Scratch_2_0_2_4</div>
  </div>

  <script>
    fetch("https://scratchdb.lefty.one/v3/user/info/Scratch_2_0_2_4")
      .then(r => r.json())
      .then(data => {
        document.getElementById("followers").textContent = data.followers;
      })
      .catch(() => {
        document.getElementById("followers").textContent = "Erreur";
      });
  </script>

</body>
</html>
