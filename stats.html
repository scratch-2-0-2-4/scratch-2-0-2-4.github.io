<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stats</title>
  <link rel="icon" type="image/png" href="https://cdn2.scratch.mit.edu/get_image/user/129754968_90x90.png">
  <link href="/style.css" rel="stylesheet" type="text/css" media="all">
</head>
<body>

  <h1>Followers Scratch</h1>
  <div id="main-followers">—</div>

  <h2>Followers</h2>
  <div id="stat-followers">—</div>

  <h2>Projets</h2>
  <div id="stat-projects">—</div>

  <h2>Abonnements</h2>
  <div id="stat-following">—</div>

  <script>
    async function loadStats() {
      try {
        const res = await fetch('https://crimson-resonance-40a3.gqekljen2.workers.dev/stats/Scratch_2_0_2_4');
        const data = await res.json();
        const f = data.followers.toLocaleString('fr-FR');
        document.getElementById('main-followers').textContent = f;
        document.getElementById('stat-followers').textContent = f;
        document.getElementById('stat-projects').textContent = data.projects.toLocaleString('fr-FR');
        document.getElementById('stat-following').textContent = data.following.toLocaleString('fr-FR');
      } catch(e) {
        ['main-followers','stat-followers','stat-projects','stat-following'].forEach(id => {
          document.getElementById(id).textContent = '—';
        });
      }
    }

    loadStats();
  </script>
<footer>Merci à <a href="https://scratch.mit.edu/users/samoht1616" target="_blank">samoht1616</a> pour les stats.</footer>
</body>
</html>
