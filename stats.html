<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Followers Scratch</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      text-align: center;
      padding-top: 60px;
    }
    .box {
      background: white;
      padding: 25px;
      width: 260px;
      margin: auto;
      border-radius: 12px;
      box-shadow: 0 0 10px #0003;
    }
    .number {
      font-size: 48px;
      font-weight: bold;
      color: #007bff;
    }
  </style>
</head>
<body>

  <div class="box">
    <h2>Followers</h2>
    <div id="followers" class="number">Chargement...</div>
    <p>Scratch_2_0_2_4</p>
  </div>

  <script>
    fetch("https://scratchdb.lefty.one/v3/user/info/Scratch_2_0_2_4")
      .then(r => r.json())
      .then(data => {
        document.getElementById("followers").textContent = data.followers;
      })
      .catch(() => {
        document.getElementById("followers").textContent = "Erreur";
      });
  </script>

</body>
</html>
