<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Stats simples — Scratch_2_0_2_4</title>
  <style>
    body{font-family:Arial,Helvetica,sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center;background:#f6f8ff;margin:0}
    .box{background:#fff;padding:18px;border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.06);width:360px;text-align:center}
    .n{font-weight:700;font-size:24px}
    .l{color:#666;margin-top:6px;font-size:13px}
    .err{color:#c33;margin-top:10px;font-size:13px}
  </style>
</head>
<body>
  <div class="box">
    <div class="n" id="followers">…</div>
    <div class="l">Followers</div>

    <div style="height:12px"></div>

    <div class="n" id="projects">…</div>
    <div class="l">Projets</div>

    <div style="height:12px"></div>

    <div class="n" id="following">…</div>
    <div class="l">Abonnements</div>

    <div class="err" id="err" aria-live="polite"></div>
  </div>

<script>
  const USER = 'Scratch_2_0_2_4';
  const out = id => document.getElementById(id);
  async function load() {
    try {
      const res = await fetch('https://scratchdb.lefty.one/v3/user/info/' + encodeURIComponent(USER));
      if (!res.ok) throw new Error('Impossible de contacter ScratchDB (' + res.status + ')');
      const j = await res.json();
      // chemins possibles pour les compteurs
      const followers = j.statistics?.followers ?? j.stats?.followers ?? j.followers ?? null;
      const projects  = j.statistics?.projects  ?? j.stats?.projects  ?? j.project_count ?? j.projects ?? null;
      const following = j.statistics?.following ?? j.stats?.following ?? j.following ?? null;
      out('followers').textContent = (typeof followers === 'number') ? followers.toLocaleString('fr-FR') : '—';
      out('projects').textContent  = (typeof projects  === 'number') ? projects.toLocaleString('fr-FR')  : '—';
      out('following').textContent = (typeof following === 'number') ? following.toLocaleString('fr-FR') : '—';
    } catch (e) {
      out('err').textContent = 'Erreur : ' + e.message;
      out('followers').textContent = out('projects').textContent = out('following').textContent = '—';
      console.error(e);
    }
  }
  load();
</script>
</body>
</html>
