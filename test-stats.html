<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Stats Scratch - Scratch_2_0_2_4</title>
  <style>
    :root {
      --bg: #f6f8ff;
      --card: white;
      --muted: #666;
      --accent: #4C97FF;
      --radius: 10px;
      --shadow: 0 4px 18px rgba(13, 24, 55, 0.06);
      font-family: Inter, "Segoe UI", Arial, sans-serif;
    }
    body {
      margin: 0; min-height: 100vh; display:flex;
      align-items:center; justify-content:center;
      background: var(--bg); padding: 24px;
    }
    .card {
      width: 520px; background: var(--card); border-radius: 14px;
      box-shadow: var(--shadow); padding: 18px;
    }
    h1 { margin: 0 0 12px 0; font-size:16px; }
    .stats {
      display: flex; gap:12px;
    }
    .stat {
      flex: 1;
      text-align: center;
      padding: 12px;
      border-radius: var(--radius);
      border: 1px solid #eef2ff;
      background: linear-gradient(180deg, rgba(255,255,255,0.6), rgba(250,250,255,0.6));
    }
    .value { font-size:20px; font-weight:700; color:#111; }
    .label { font-size:12px; color:var(--muted); margin-top:6px; }
    .small { font-size:12px; color:var(--muted); margin-top:8px; text-align:center; }
    .spinner { display:inline-block; animation:spin 1s linear infinite; }
    @keyframes spin { from{ transform:rotate(0deg)} to{ transform:rotate(360deg)} }
    .note { margin-top:10px; font-size:12px; color:#888; }
    a.btn {
      display:inline-block; margin-top:12px; padding:8px 12px;
      background:var(--accent); color:white; border-radius:8px; text-decoration:none; font-size:13px;
    }
    pre { white-space:pre-wrap; word-break:break-word; background:#fafafa; padding:8px; border-radius:8px; font-size:12px; }
  </style>
</head>
<body>
  <main class="card" role="main" aria-labelledby="title">
    <h1 id="title">Statistiques — Scratch_2_0_2_4</h1>

    <div class="stats" aria-live="polite">
      <div class="stat" role="group" aria-label="Followers">
        <div class="value" id="follows"><span class="spinner">⟳</span></div>
        <div class="label">Followers</div>
      </div>

      <div class="stat" role="group" aria-label="Projets">
        <div class="value" id="projects"><span class="spinner">⟳</span></div>
        <div class="label">Projets</div>
      </div>

      <div class="stat" role="group" aria-label="Abonnements">
        <div class="value" id="following"><span class="spinner">⟳</span></div>
        <div class="label">Abonnements</div>
      </div>
    </div>

    <div class="small">
      Source : Scratch API (api.scratch.mit.edu) — tentative via ScratchDB puis fallback paginé.
    </div>

    <a class="btn" id="openProfile" href="#" target="_blank" rel="noopener">Ouvrir le profil Scratch</a>
    <div class="note" id="note">Chargement...</div>
  </main>

<script>
/*
  Page autonome : récupère et affiche Followers / Projects / Following
  - CHANGEZ USERNAME si nécessaire.
  - PROXY : laisser vide si vous servez la page depuis un serveur sans besoin de proxy CORS.
           sinon mettre un proxy comme 'https://corsproxy.io/?url=' ou un proxy perso.
*/

const USERNAME = 'Scratch_2_0_2_4';
const BOTS = 0; // si vous voulez soustraire quelques comptes "bots"
const PROXY = ''; // ex: 'https://corsproxy.io/?url='  (laisser vide si pas besoin)

const el = {
  follows: document.getElementById('follows'),
  projects: document.getElementById('projects'),
  following: document.getElementById('following'),
  note: document.getElementById('note'),
  openProfile: document.getElementById('openProfile')
};

el.openProfile.href = `https://scratch.mit.edu/users/${encodeURIComponent(USERNAME)}`;

/* Helper pour créer URL (avec cache-buster) */
function buildApiUrl(path, useProxy = !!PROXY) {
  const cacheBuster = `_=${Date.now()}`;
  const base = 'https://api.scratch.mit.edu' + path + (path.includes('?') ? '&' : '?') + cacheBuster;
  if (useProxy) {
    // some proxies expect the target URL encoded after ?url= or directly after endpoint
    // Our PROXY should be a prefix that accepts the target URL as-is, e.g. 'https://corsproxy.io/?url='
    return PROXY + encodeURIComponent(base);
  }
  return base;
}

/* 1) Tentative rapide via ScratchDB (si disponible) */
async function tryScratchDB() {
  try {
    // ScratchDB often allows CORS; no proxy used here intentionally
    const url = `https://scratchdb.lefty.one/v3/user/info/${encodeURIComponent(USERNAME)}?_=${Date.now()}`;
    const r = await fetch(url);
    if (!r.ok) throw new Error('ScratchDB non disponible');
    const j = await r.json();
    // Possible fields (various snapshots): try common ones
    const followers = j.statistics?.followers ?? j.stats?.followers ?? j.profile?.followers ?? j.followers ?? null;
    const projects  = j.statistics?.projects  ?? j.stats?.projects  ?? j.project_count ?? j.projects ?? null;
    const following = j.statistics?.following ?? j.stats?.following ?? j.following ?? null;
    if ((followers !== null && typeof followers === 'number') ||
        (projects !== null && typeof projects === 'number') ||
        (following !== null && typeof following === 'number')) {
      return {
        followers: (typeof followers === 'number') ? followers : null,
        projects : (typeof projects  === 'number') ? projects  : null,
        following: (typeof following === 'number') ? following : null
      };
    }
    return null;
  } catch (e) {
    console.warn('ScratchDB failed:', e && e.message);
    return null;
  }
}

/* 2) Fallback paginé vers api.scratch.mit.edu (force cache-buster)
   Note: si PROXY vide, we call api.scratch.mit.edu directly (CORS may block in browser) */
async function countPages(path, maxPages = 300) {
  let total = 0;
  let offset = 0;
  const pageSize = 40;
  for (let page = 0; page < maxPages; page++) {
    const targetPath = `${path}?limit=${pageSize}&offset=${offset}`;
    const url = buildApiUrl(targetPath, !!PROXY);
    try {
      const r = await fetch(url);
      if (!r.ok) {
        // if the proxy encoded the URL twice or returned HTML, try a direct fetch once (only if PROXY set)
        if (PROXY) {
          try {
            const direct = await fetch('https://api.scratch.mit.edu' + targetPath + '&_=' + Date.now());
            if (!direct.ok) break;
            const dataDirect = await direct.json();
            if (!Array.isArray(dataDirect) || dataDirect.length === 0) break;
            total += dataDirect.length;
            if (dataDirect.length < pageSize) break;
            offset += pageSize;
            continue;
          } catch (e) { break; }
        }
        break;
      }
      const data = await r.json();
      if (!Array.isArray(data) || data.length === 0) break;
      total += data.length;
      if (data.length < pageSize) break;
      offset += pageSize;
    } catch (e) {
      console.error('countPages fetch error', e);
      break;
    }
  }
  return total;
}

/* Orchestration: try ScratchDB then fallback */
async function fetchCounts() {
  el.note.textContent = 'Tentative par ScratchDB...';
  const fromDb = await tryScratchDB();
  if (fromDb) {
    el.note.textContent = 'Données fournies par ScratchDB (rapide).';
    return {
      followers: fromDb.followers ?? null,
      projects:  fromDb.projects  ?? null,
      following: fromDb.following ?? null
    };
  }

  el.note.textContent = 'ScratchDB indisponible — fallback via l\'API Scratch (plus long)...';
  // On lance les 3 comptages en parallèle
  const [followers, projects, following] = await Promise.all([
    countPages(`/users/${encodeURIComponent(USERNAME)}/followers`),
    countPages(`/users/${encodeURIComponent(USERNAME)}/projects`),
    countPages(`/users/${encodeURIComponent(USERNAME)}/following`)
  ]);
  el.note.textContent = 'Données récupérées depuis api.scratch.mit.edu.';
  return { followers, projects, following };
}

/* Affichage final */
function showNumber(elm, n) {
  if (typeof n === 'number' && !isNaN(n)) elm.textContent = Math.max(0, n - BOTS).toLocaleString('fr-FR');
  else elm.textContent = '—';
}

/* Exécution */
(async function main(){
  try {
    const counts = await fetchCounts();
    showNumber(el.follows, counts.followers ?? null);
    showNumber(el.projects, counts.projects ?? null);
    showNumber(el.following, counts.following ?? null);
    el.note.textContent += '  (rafraîchir la page pour mettre à jour)';
  } catch (e) {
    console.error(e);
    el.note.textContent = 'Erreur lors de la récupération des statistiques.';
    showNumber(el.follows, null);
    showNumber(el.projects, null);
    showNumber(el.following, null);
  }
})();
</script>
</body>
</html>
