<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <title>Stats Scratch (scratchviews)</title>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <style>
    body{font-family:Arial,Helvetica,sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center;background:#f6f8ff;margin:0}
    .box{background:#fff;padding:18px;border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.06);width:360px;text-align:center}
    .n{font-weight:700;font-size:24px}
    .l{color:#666;margin-top:6px;font-size:13px}
    .err{color:#c33;margin-top:10px;font-size:13px}
    button{margin-top:12px;padding:8px 12px;border-radius:8px;border:0;background:#4C97FF;color:#fff;cursor:pointer}
    .small{font-size:12px;color:#666;margin-top:8px}
  </style>
</head>
<body>
  <div class="box" role="main" aria-live="polite">
    <div class="n" id="followers">…</div>
    <div class="l">Followers</div>

    <div style="height:12px"></div>

    <div class="n" id="projects">…</div>
    <div class="l">Projets</div>

    <div style="height:12px"></div>

    <div class="n" id="following">…</div>
    <div class="l">Abonnements</div>

    <div class="err" id="err"></div>
    <div class="small" id="note">Récupération depuis scratchviews.com/users/Scratch_2_0_2_4 …</div>
    <button id="retry">Réessayer</button>
  </div>

<script>
const TARGET = 'https://scratchviews.com/users/Scratch_2_0_2_4';
const FALLBACK_PROXIES = [
  'https://api.allorigins.win/raw?url=',
  'https://r.jina.ai/http://',      // sometimes works for simple GET
  'https://corsproxy.io/?url='
];

const el = id => document.getElementById(id);

function parseNumberStr(s){
  if(!s) return null;
  // keep digits only
  const digits = s.replace(/[^\d]/g,'');
  if(!digits) return null;
  return parseInt(digits, 10);
}

function extractCountsFromHtml(html){
  // Try a few label patterns. Return object {followers, projects, following} (numbers or null)
  const tryFind = (label) => {
    // label may appear before or after the number; try both
    const reAfter = new RegExp(label + '[^\\d]{0,60}([\\d.,\\s]+)', 'i');
    const reBefore = new RegExp('([\\d.,\\s]+)[^\\d]{0,60}' + label, 'i');
    let m = html.match(reAfter);
    if(m && m[1]) return parseNumberStr(m[1]);
    m = html.match(reBefore);
    if(m && m[1]) return parseNumberStr(m[1]);
    return null;
  };

  // common labels on scratchviews page (english)
  const followers = tryFind('Followers') ?? tryFind('follower') ?? tryFind('followers');
  const projects  = tryFind('Projects') ?? tryFind('Projects') ?? tryFind('projects') ?? tryFind('Project Count');
  const following = tryFind('Following') ?? tryFind('following') ?? tryFind('Following');
  return { followers, projects, following };
}

async function fetchTextWithAttempts(url){
  // try direct fetch first
  try {
    const r = await fetch(url);
    if(r.ok){
      return await r.text();
    }
  } catch(e){
    // direct failed (likely CORS) - fall back to proxies
  }
  // try proxies one by one
  for(const p of FALLBACK_PROXIES){
    try{
      let fetchUrl;
      if(p.includes('r.jina.ai')) {
        // jina expects http:// then the full target
        fetchUrl = p + url;
      } else {
        fetchUrl = p + encodeURIComponent(url);
      }
      const r = await fetch(fetchUrl);
      if(!r.ok) continue;
      const txt = await r.text();
      if(txt && txt.length>0) return txt;
    }catch(e){
      // try next
      continue;
    }
  }
  throw new Error('Impossibilité de récupérer la page (CORS / proxies indisponibles).');
}

async function load(){
  el('err').textContent = '';
  el('note').textContent = 'Récupération en cours…';
  el('followers').textContent = el('projects').textContent = el('following').textContent = '…';
  try{
    const html = await fetchTextWithAttempts(TARGET);
    const counts = extractCountsFromHtml(html);
    el('followers').textContent = counts.followers == null ? '—' : counts.followers.toLocaleString('fr-FR');
    el('projects').textContent  = counts.projects  == null ? '—' : counts.projects.toLocaleString('fr-FR');
    el('following').textContent = counts.following == null ? '—' : counts.following.toLocaleString('fr-FR');
    el('note').textContent = 'Données extraites de scratchviews.com (si vide, parsing non fiable).';
    // if all null, show snippet for debugging
    if(counts.followers==null && counts.projects==null && counts.following==null){
      el('err').textContent = 'Parsing impossible : la page a une structure inattendue.';
    }
  }catch(err){
    console.error(err);
    el('err').textContent = 'Erreur : ' + (err.message || err);
    el('note').textContent = 'Si erreur CORS, la seule solution fiable est un petit relais serveur.';
    el('followers').textContent = el('projects').textContent = el('following').textContent = '—';
  }
}

document.getElementById('retry').addEventListener('click', load);
load();
</script>
</body>
</html>
