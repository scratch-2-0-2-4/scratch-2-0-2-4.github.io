<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Profil Scratch - Scratch_2_0_2_4</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Segoe UI,Arial,sans-serif;background:#f0f4ff;min-height:100vh;padding:2rem 1rem;transition:background .3s}
    body.dark{background:#0f0f1a;color:#eee}
    .page{max-width:700px;margin:0 auto;position:relative;z-index:1}
    .card{background:#fff;border-radius:12px;overflow:hidden;margin-bottom:1rem;padding:0;box-shadow:0 6px 20px rgba(2,6,23,.06)}
    body.dark .card{background:#161623}
    .banner{height:110px;background:linear-gradient(135deg,#4C97FF,#9966FF)}
    .profile-header{padding:1rem 1.5rem}
    .avatar{width:76px;height:76px;border-radius:50%;border:4px solid white;margin-top:-38px;background:#4C97FF;overflow:hidden}
    .avatar img{width:100%;height:100%;object-fit:cover;display:block}
    .username{font-size:22px;font-weight:700;margin-top:8px}
    .joined{font-size:13px;color:#777;margin-top:4px}
    .bio{font-size:14px;color:#555;margin-top:10px;white-space:pre-line}
    .stats-grid{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid #f0f0f0}
    .stat{padding:1rem;text-align:center}
    .stat-value{font-size:20px;font-weight:700}
    .stat-label{font-size:12px;color:#888;margin-top:6px}
    .section-title{padding:1rem 1.5rem 0.5rem;font-weight:700}
    .projects-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:0 1.5rem 1.5rem}
    .project-card{background:#f7f9ff;border-radius:8px;overflow:hidden;border:1px solid #eef0ff;cursor:pointer}
    .project-thumb img{width:100%;height:90px;object-fit:cover;display:block}
    .project-info{padding:8px 10px}
    .project-name{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .project-stats{font-size:11px;color:#999;margin-top:4px}
    .scratch-btn{display:block;margin:0 1.5rem 1.5rem;padding:10px;text-align:center;background:#4C97FF;color:#fff;border-radius:10px;text-decoration:none;font-weight:600}
    .loading{text-align:center;padding:2rem;color:#999}
    .spin{display:inline-block;animation:spin 1s linear infinite}
    @keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
    .toggle-btn{position:fixed;top:16px;right:16px;padding:8px 12px;border-radius:20px;border:1px solid #ddd;background:#fff;z-index:20;cursor:pointer}
    body.dark .toggle-btn{background:#1e1e2e;color:#eee;border-color:#444}
    .note{padding:0 1.5rem 1rem;color:#666;font-size:13px}
  </style>
</head>
<body class="dark">
  <button class="toggle-btn" id="darkBtn" aria-pressed="true">☀️ Mode clair</button>

  <div class="page">
    <div class="card" id="profileCard">
      <div class="loading"><span class="spin">⟳</span> Chargement du profil…</div>
    </div>
  </div>

  <script>
    // CONFIG
    const USERNAME = 'Scratch_2_0_2_4';
    const BOTS = 0; // si tu veux soustraire des bots
    // Proxies de secours (dans l'ordre d'essai). Laisse vide pour essai direct.
    const PROXIES = [
      '', // direct
      'https://api.allorigins.win/raw?url=',
      'https://r.jina.ai/http://',
      'https://corsproxy.io/?url='
    ];

    // Utilitaires
    const q = sel => document.querySelector(sel);
    const createElem = (tag, cls, html) => { const e = document.createElement(tag); if(cls) e.className = cls; if(html!=null) e.innerHTML = html; return e; };

    async function tryFetch(targetUrl) {
      // Essaie direct puis proxies
      for (const prefix of PROXIES) {
        let url = prefix ? (prefix.includes('r.jina.ai') ? prefix + targetUrl : prefix + encodeURIComponent(targetUrl)) : targetUrl;
        try {
          const res = await fetch(url);
          if (!res.ok) continue;
          // essaye JSON, sinon texte
          const ct = res.headers.get('content-type') || '';
          if (ct.includes('application/json') || ct.includes('json')) return await res.json();
          const txt = await res.text();
          try { return JSON.parse(txt); } catch(e) { return txt; }
        } catch (e) {
          // passer au prochain proxy
          continue;
        }
      }
      throw new Error('Impossible de récupérer l\'URL (CORS / proxys indisponibles).');
    }

    // Extraction simple depuis scratchviews HTML
    function parseScratchViews(html) {
      if (!html || typeof html !== 'string') return { followers: null, projects: null, following: null };
      const norm = html.replace(/\s+/g,' ');
      const findNum = (label) => {
        const reAfter = new RegExp(label + '[^\\d]{0,30}([\\d.,\\s]+)', 'i');
        const reBefore = new RegExp('([\\d.,\\s]+)[^\\d]{0,30}' + label, 'i');
        let m = norm.match(reAfter); if (m && m[1]) return parseInt(m[1].replace(/[^\d]/g,''),10);
        m = norm.match(reBefore); if (m && m[1]) return parseInt(m[1].replace(/[^\d]/g,''),10);
        return null;
      };
      return {
        followers: findNum('Followers') ?? findNum('Followers&nbsp;') ?? findNum('Abonnés') ?? null,
        projects:  findNum('Projects') ?? findNum('Projects&nbsp;') ?? findNum('Projets') ?? null,
        following: findNum('Following') ?? findNum('Abonnements') ?? null
      };
    }

    // Comptage paginé via API Scratch (fallback serveur-side emulation via proxies)
    async function countPagesViaApi(path, maxPages=300) {
      const pageSize = 40;
      let total = 0;
      for (let page = 0; page < maxPages; page++) {
        const offset = page * pageSize;
        const target = `https://api.scratch.mit.edu${path}?limit=${pageSize}&offset=${offset}&_=${Date.now()}`;
        try {
          const data = await tryFetch(target);
          if (!Array.isArray(data)) break;
          if (data.length === 0) break;
          total += data.length;
          if (data.length < pageSize) break;
          // small delay
          await new Promise(r => setTimeout(r, 100));
        } catch (e) {
          console.warn('countPagesViaApi failed', e);
          break;
        }
      }
      return total;
    }

    async function loadProfile() {
      const card = q('#profileCard');
      try {
        // 1) Récupérer la page scratchviews (contient souvent les compteurs en clair)
        const svUrl = `https://scratchviews.com/users/${encodeURIComponent(USERNAME)}`;
        let svRaw;
        try {
          svRaw = await tryFetch(svUrl);
        } catch(e) {
          svRaw = null;
        }

        let counts = { followers: null, projects: null, following: null, source: null };
        if (typeof svRaw === 'string') {
          counts = parseScratchViews(svRaw);
          counts.source = 'scratchviews';
        }

        // 2) Récupérer le profil utilisateur / projets depuis API Scratch (direct ou via proxy) pour afficher avatar/bio/projects
        const apiUserUrl = `https://api.scratch.mit.edu/users/${encodeURIComponent(USERNAME)}`;
        const apiProjectsUrl = `https://api.scratch.mit.edu/users/${encodeURIComponent(USERNAME)}/projects?limit=4`;

        let userJson = null, projectsJson = [];
        try {
          userJson = await tryFetch(apiUserUrl);
        } catch(e) {
          userJson = null;
        }
        try {
          projectsJson = await tryFetch(apiProjectsUrl);
        } catch(e) {
          projectsJson = [];
        }

        // 3) If followers missing, fallback to paginated counting via API
        if (counts.followers == null) {
          counts.followers = await countPagesViaApi(`/users/${encodeURIComponent(USERNAME)}/followers`);
          counts.source = counts.source ? counts.source + ' + api' : 'api';
        }
        if (counts.projects == null) {
          // prefer the projects count from Scratch API if present
          if (userJson && (userJson.project_count || userJson.count || userJson.stats?.projects || userJson.statistics?.projects)) {
            counts.projects = userJson.project_count ?? userJson.count ?? userJson.stats?.projects ?? userJson.statistics?.projects ?? null;
          } else {
            counts.projects = await countPagesViaApi(`/users/${encodeURIComponent(USERNAME)}/projects`);
          }
        }
        if (counts.following == null) {
          counts.following = await countPagesViaApi(`/users/${encodeURIComponent(USERNAME)}/following`);
        }

        // Build HTML
        const avatar = (userJson && userJson.profile && userJson.profile.images && userJson.profile.images['90x90']) ? userJson.profile.images['90x90'] : '';
        const username = (userJson && userJson.username) ? userJson.username : USERNAME;
        const joined = (userJson && userJson.history && userJson.history.joined)
          ? new Date(userJson.history.joined).toLocaleDateString('fr-FR', { year:'numeric', month:'long' })
          : '';
        const country = userJson && userJson.profile && userJson.profile.country ? ' · ' + userJson.profile.country : '';
        const bio = userJson && userJson.profile && userJson.profile.bio ? userJson.profile.bio : '';
        const status = userJson && userJson.profile && userJson.profile.status ? userJson.profile.status : '';

        card.innerHTML = `
          <div class="banner"></div>
          <div class="profile-header">
            <div style="display:flex;gap:12px;align-items:flex-end">
              <div class="avatar"><img src="${avatar}" alt="Avatar" onerror="this.parentElement.innerHTML='<div style=&quot;padding:18px;font-size:20px;text-align:center&quot;>🙂</div>'" /></div>
              <div>
                <div class="username">${username}</div>
                <div class="joined">Membre depuis ${joined}${country}</div>
                ${bio ? `<div class="bio">${bio}</div>` : ''}
                ${status ? `<div class="bio">🔨 ${status}</div>` : ''}
              </div>
            </div>
          </div>

          <div class="stats-grid">
            <div class="stat">
              <div class="stat-value" id="statFollowers">${counts.followers != null ? Math.max(0, counts.followers - BOTS).toLocaleString('fr-FR') : '—'}</div>
              <div class="stat-label">Followers</div>
            </div>
            <div class="stat">
              <div class="stat-value" id="statProjets">${counts.projects != null ? counts.projects.toLocaleString('fr-FR') : '—'}</div>
              <div class="stat-label">Projets</div>
            </div>
            <div class="stat">
              <div class="stat-value" id="statSuivi">${counts.following != null ? counts.following.toLocaleString('fr-FR') : '—'}</div>
              <div class="stat-label">Abonnements</div>
            </div>
          </div>

          ${Array.isArray(projectsJson) && projectsJson.length ? `
            <div class="section-title">Projets récents</div>
            <div class="projects-grid">
              ${projectsJson.map(p => `
                <div class="project-card" onclick="window.open('https://scratch.mit.edu/projects/${p.id}')">
                  <div class="project-thumb"><img src="https://cdn2.scratch.mit.edu/get_image/project/${p.id}_480x360.png" alt="${p.title}" onerror="this.parentElement.innerHTML='<div style=&quot;height:90px;display:flex;align-items:center;justify-content:center&quot;>🎮</div>'" /></div>
                  <div class="project-info">
                    <div class="project-name">${p.title}</div>
                    <div class="project-stats">❤️ ${p.stats?.loves||0} &nbsp;⭐ ${p.stats?.favorites||0} &nbsp;👁️ ${p.stats?.views||0}</div>
                  </div>
                </div>
              `).join('')}
            </div>
          ` : ''}

          <a class="scratch-btn" href="https://scratch.mit.edu/users/${encodeURIComponent(USERNAME)}" target="_blank" rel="noopener">Voir le profil complet sur Scratch</a>
          <div class="note">Données via : ${counts.source || 'inconnue'}</div>
        `;
      } catch (e) {
        console.error(e);
        card.innerHTML = `<div class="loading">❌ Erreur : ${e.message || e}</div>`;
      }
    }

    // Particules visuelles (optionnel)
    function initParticles() {
      const canvasId = 'particles';
      let canvas = document.getElementById(canvasId);
      if (!canvas) {
        canvas = document.createElement('canvas');
        canvas.id = canvasId;
        canvas.style.position = 'fixed';
        canvas.style.top = 0;
        canvas.style.left = 0;
        canvas.style.width = '100%';
        canvas.style.height = '100%';
        canvas.style.zIndex = 0;
        canvas.style.pointerEvents = 'none';
        document.body.appendChild(canvas);
      }
      const ctx = canvas.getContext('2d');
      function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
      resize();
      const color = '108,99,255';
      const pts = Array.from({length:60}, () => ({ x:Math.random()*canvas.width, y:Math.random()*canvas.height, r:Math.random()*2+1, dx:(Math.random()-0.5)*0.5, dy:(Math.random()-0.5)*0.5, a:Math.random()*0.4+0.05 }));
      function draw() {
        ctx.clearRect(0,0,canvas.width,canvas.height);
        pts.forEach(p => {
          ctx.beginPath();
          ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
          ctx.fillStyle = `rgba(${color},${p.a})`;
          ctx.fill();
          p.x += p.dx; p.y += p.dy;
          if (p.x < 0 || p.x > canvas.width) p.dx *= -1;
          if (p.y < 0 || p.y > canvas.height) p.dy *= -1;
        });
        window._raf = requestAnimationFrame(draw);
      }
      if (window._raf) cancelAnimationFrame(window._raf);
      draw();
      window.addEventListener('resize', resize);
    }

    // Dark toggle
    document.getElementById('darkBtn').addEventListener('click', () => {
      document.body.classList.toggle('dark');
      const pressed = document.body.classList.contains('dark');
      document.getElementById('darkBtn').textContent = pressed ? '☀️ Mode clair' : '🌙 Mode sombre';
    });

    // Start
    initParticles();
    loadProfile();
  </script>
</body>
</html>
