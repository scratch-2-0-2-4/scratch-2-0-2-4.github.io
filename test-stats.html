<!DOCTYPE html>

<html lang="fr">
 <head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Profil Scratch - Scratch_2_0_2_4</title>
 </head>
 <body>
<div id="stats" style="display:flex;gap:12px;max-width:520px;margin:1rem auto;font-family:Arial,Helvetica,sans-serif;">
  <div style="flex:1;text-align:center;padding:12px;border:1px solid #eee;border-radius:8px;">
    <div id="follows" style="font-weight:700;font-size:20px">…</div>
    <div style="color:#666;font-size:12px">Followers</div>
  </div>
  <div style="flex:1;text-align:center;padding:12px;border:1px solid #eee;border-radius:8px;">
    <div id="projects" style="font-weight:700;font-size:20px">…</div>
    <div style="color:#666;font-size:12px">Projets</div>
  </div>
  <div style="flex:1;text-align:center;padding:12px;border:1px solid #eee;border-radius:8px;">
    <div id="following" style="font-weight:700;font-size:20px">…</div>
    <div style="color:#666;font-size:12px">Abonnements</div>
  </div>
</div>

<script>
const USERNAME = 'Scratch_2_0_2_4';
const BOTS = 0; // si vous souhaitez soustraire des comptes fantômes
const PROXY = 'https://corsproxy.io/?url='; // ou remplacez par votre proxy

function apiURL(path) {
  // ajoute un cache-buster avant l'encodage pour éviter que le proxy renvoie du contenu en cache
  const sep = path.includes('?') ? '&' : '?';
  return PROXY + encodeURIComponent('https://api.scratch.mit.edu' + path + sep + '_=' + Date.now());
}

async function countPages(path) {
  let total = 0, offset = 0;
  while (true) {
    try {
      const res = await fetch(apiURL(`${path}?limit=40&offset=${offset}`));
      if (!res.ok) break;
      const data = await res.json();
      if (!Array.isArray(data) || data.length === 0) break;
      total += data.length;
      if (data.length < 40) break;
      offset += 40;
    } catch (e) {
      console.error('countPages error', e);
      break;
    }
  }
  return total;
}

async function fetchCounts() {
  // 1) tentative rapide via ScratchDB (souvent plus directe)
  try {
    const r = await fetch(`https://scratchdb.lefty.one/v3/user/info/${encodeURIComponent(USERNAME)}?_=${Date.now()}`);
    if (r.ok) {
      const d = await r.json();
      // champs possibles selon la réponse — on tente plusieurs chemins
      const followers = d.statistics?.followers ?? d.stats?.followers ?? d.profile?.followers ?? null;
      const projects  = d.statistics?.projects  ?? d.stats?.projects  ?? d.project_count ?? null;
      const following = d.statistics?.following ?? d.stats?.following ?? null;
      if (followers != null || projects != null || following != null) {
        return {
          followers: (followers != null ? followers : await countPages(`/users/${USERNAME}/followers`)),
          projects : (projects  != null ? projects  : await countPages(`/users/${USERNAME}/projects`)),
          following: (following != null ? following : await countPages(`/users/${USERNAME}/following`))
        };
      }
    }
  } catch (e) {
    console.warn('ScratchDB unavailable, falling back to pagination', e);
  }

  // 2) fallback plus fiable : compter les pages en forçant le cache-buster
  const [followers, projects, following] = await Promise.all([
    countPages(`/users/${USERNAME}/followers`),
    countPages(`/users/${USERNAME}/projects`),
    countPages(`/users/${USERNAME}/following`)
  ]);
  return { followers, projects, following };
}

(async function fillStats(){
  try {
    const counts = await fetchCounts();
    document.getElementById('follows').textContent = Math.max(0, (counts.followers||0) - BOTS).toLocaleString('fr-FR');
    document.getElementById('projects').textContent = (counts.projects||0).toLocaleString('fr-FR');
    document.getElementById('following').textContent= (counts.following||0).toLocaleString('fr-FR');
  } catch (e) {
    console.error(e);
    document.getElementById('follows').textContent = '—';
    document.getElementById('projects').textContent = '—';
    document.getElementById('following').textContent = '—';
  }
})();
</script>
 </body>
</html>
