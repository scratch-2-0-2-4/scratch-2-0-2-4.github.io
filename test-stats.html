  <script>
    const USERNAME = 'Scratch_2_0_2_4';
    const BOTS = 0; // comptes supprimés/bots à soustraire
    const PROXY = 'https://corsproxy.io/?url=';
    let darkMode = true;

    function toggleDark() {
      darkMode = !darkMode;
      document.body.classList.toggle('dark', darkMode);
      document.getElementById('darkBtn').textContent = darkMode ? '☀️ Mode clair' : '🌙 Mode sombre';
      initParticles();
    }

    function apiURL(path) {
      return PROXY + encodeURIComponent('https://api.scratch.mit.edu' + path);
    }

    async function countPages(path) {
      let total = 0, offset = 0;
      while (true) {
        const res = await fetch(apiURL(`${path}?limit=40&offset=${offset}`));
        if (!res.ok) break;
        const data = await res.json();
        if (!Array.isArray(data) || data.length === 0) break;
        total += data.length;
        if (data.length < 40) break;
        offset += 40;
      }
      return total;
    }

    async function loadProfile() {
      try {
        const [userRes, projectsRes] = await Promise.all([
          fetch(apiURL(`/users/${USERNAME}`)),
          fetch(apiURL(`/users/${USERNAME}/projects?limit=4`))
        ]);

        if (!userRes.ok) throw new Error('Utilisateur introuvable');

        const user = await userRes.json();
        const projects = await projectsRes.json();
        const joined = new Date(user.history.joined)
          .toLocaleDateString('fr-FR', { year: 'numeric', month: 'long' });

        document.getElementById('profileCard').innerHTML = `
          <div class="banner"></div>
          <div class="profile-header">
            <div class="avatar">
              <img src="${user.profile.images['90x90']}" alt="Avatar" />
            </div>
            <div class="username">${user.username}</div>
            <div class="joined">Membre depuis ${joined}${user.profile.country ? ' · ' + user.profile.country : ''}</div>
            ${user.profile.bio   ? `<div class="bio">${user.profile.bio}</div>` : ''}
            ${user.profile.status ? `<div class="status">🔨 ${user.profile.status}</div>` : ''}
          </div>
          <div class="stats-grid">
            <div class="stat">
              <div class="stat-value" id="statFollowers"><span class="spin">⟳</span></div>
              <div class="stat-label">Followers</div>
            </div>
            <div class="stat">
              <div class="stat-value" id="statProjets"><span class="spin">⟳</span></div>
              <div class="stat-label">Projets</div>
            </div>
            <div class="stat">
              <div class="stat-value" id="statSuivi"><span class="spin">⟳</span></div>
              <div class="stat-label">Abonnements</div>
            </div>
          </div>
          ${projects.length ? `
            <div class="section-title">Projets récents</div>
            <div class="projects-grid">
              ${projects.map(p => `
                <div class="project-card" onclick="window.open('https://scratch.mit.edu/projects/${p.id}')">
                  <div class="project-thumb">
                    <img
                      src="https://cdn2.scratch.mit.edu/get_image/project/${p.id}_480x360.png"
                      alt="${p.title}"
                      onerror="this.parentElement.innerHTML='<div class=\\'no-img\\'>🎮</div>'"
                    />
                  </div>
                  <div class="project-info">
                    <div class="project-name">${p.title}</div>
                    <div class="project-stats">❤️ ${p.stats?.loves||0} &nbsp;⭐ ${p.stats?.favorites||0} &nbsp;👁️ ${p.stats?.views||0}</div>
                  </div>
                </div>
              `).join('')}
            </div>
          ` : ''}
          <a class="scratch-btn" href="https://scratch.mit.edu/users/${USERNAME}" target="_blank">
            Voir le profil complet sur Scratch
          </a>
        `;

        // Charger les 3 stats en parallèle
        const results = await Promise.all([
          countPages(`/users/${USERNAME}/followers`),
          countPages(`/users/${USERNAME}/projects`),
          countPages(`/users/${USERNAME}/following`)
        ]);

        const totalFollowers = results[0];
        const totalProjets   = results[1];
        const totalSuivis    = results[2];

        document.getElementById('statFollowers').textContent = Math.max(0, totalFollowers - BOTS).toLocaleString('fr-FR');
        document.getElementById('statProjets').textContent   = totalProjets.toLocaleString('fr-FR');
        document.getElementById('statSuivi').textContent     = totalSuivis.toLocaleString('fr-FR');

      } catch (e) {
        document.getElementById('profileCard').innerHTML =
          `<div class="loading">❌ Erreur : ${e.message}</div>`;
      }
    }

    function initParticles() {
      const canvas = document.getElementById('particles');
      const ctx = canvas.getContext('2d');
      canvas.width  = window.innerWidth;
      canvas.height = window.innerHeight;
      const color = darkMode ? '108,99,255' : '76,151,255';
      const pts = Array.from({ length: 80 }, () => ({
        x:  Math.random() * canvas.width,
        y:  Math.random() * canvas.height,
        r:  Math.random() * 2 + 1,
        dx: (Math.random() - 0.5) * 0.5,
        dy: (Math.random() - 0.5) * 0.5,
        a:  Math.random() * 0.4 + 0.1
      }));
      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        pts.forEach(p => {
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(${color},${p.a})`;
          ctx.fill();
          p.x += p.dx; p.y += p.dy;
          if (p.x < 0 || p.x > canvas.width)  p.dx *= -1;
          if (p.y < 0 || p.y > canvas.height)  p.dy *= -1;
        });
        window._raf = requestAnimationFrame(draw);
      }
      if (window._raf) cancelAnimationFrame(window._raf);
      draw();
    }

    window.addEventListener('resize', initParticles);
    initParticles();
    loadProfile();
  </script>
